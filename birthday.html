<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday My Wify ❤️</title>

<style>

/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    overflow:hidden;
    background:#050008;
}

#app{
    height:100vh;
    width:100vw;
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 30%,
            #9b3cff 0%,
            #54117d 30%,
            #200632 65%,
            #050008 100%
        );

    transition:background 1.5s ease;
}

#app.lightsOff{
    background:#000;
}


/* =========================
   STARS
========================= */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    opacity:.7;

    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{

    from{
        opacity:.15;
        transform:scale(.5);
    }

    to{
        opacity:1;
        transform:scale(1.5);
    }
}


/* =========================
   PASSWORD SCREEN
========================= */

.passwordScreen{
    position:absolute;
    inset:0;
    z-index:9999;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
    padding:20px;
}

.passwordBox{
    width:min(500px,90vw);
    padding:35px 25px;

    border-radius:25px;

    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.2);

    box-shadow:
        0 0 30px rgba(255,255,255,.15),
        0 0 80px rgba(155,60,255,.35);

    backdrop-filter:blur(10px);
}

.passwordTitle{
    font-size:clamp(30px,7vw,55px);
    font-weight:bold;

    margin-bottom:15px;

    text-shadow:
        0 0 15px #ff7bd5,
        0 0 30px #9b3cff;
}

.passwordSubtitle{
    font-size:clamp(16px,3vw,22px);
    line-height:1.5;
}

.passwordInput{
    width:220px;
    max-width:80%;

    margin-top:22px;
    padding:14px 18px;

    border:none;
    outline:none;

    border-radius:15px;

    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.25);

    color:white;

    text-align:center;
    font-size:22px;

    letter-spacing:7px;
}

.passwordInput::placeholder{
    color:rgba(255,255,255,.6);
    letter-spacing:2px;
}

.passwordInput:focus{
    border-color:#ff9ddd;

    box-shadow:
        0 0 15px rgba(255,120,210,.5);
}

.passwordButton{
    margin-top:18px;

    padding:13px 25px;

    border:none;
    border-radius:30px;

    background:linear-gradient(
        90deg,
        #ff62b7,
        #9b3cff
    );

    color:white;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 0 20px rgba(255,80,180,.4);

    transition:.25s;
}

.passwordButton:hover{
    transform:scale(1.06);
}

.passwordError{
    min-height:25px;

    margin-top:12px;

    color:#ffb5dd;

    font-weight:bold;
}


/* =========================
   CONTENT
========================= */

#content{
    position:relative;
    width:100%;
    height:100%;
}


/* =========================
   SCREEN
========================= */

.screen{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:20px;

    z-index:10;
}

.title{
    font-size:clamp(35px,7vw,70px);

    font-weight:bold;

    margin-bottom:20px;

    color:white;

    text-shadow:
        0 0 10px #ff7bd5,
        0 0 30px #9b3cff,
        0 0 50px #ff35b9;
}

.subtitle{
    max-width:850px;

    font-size:clamp(17px,3vw,25px);

    line-height:1.6;

    color:white;

    text-shadow:
        0 0 10px rgba(255,255,255,.35);
}

button{
    margin-top:25px;

    padding:14px 28px;

    border:none;

    border-radius:30px;

    cursor:pointer;

    font-size:17px;

    font-weight:bold;

    color:white;

    background:
        linear-gradient(
            90deg,
            #ff4fa3,
            #9c4dff
        );

    box-shadow:
        0 0 20px rgba(255,80,180,.5);

    transition:.25s;
}

button:hover{
    transform:scale(1.08);
}

button.no{
    background:
        linear-gradient(
            90deg,
            #555,
            #222
        );
}


/* =========================
   BALLOONS
========================= */

.balloon{
    position:absolute;

    width:65px;
    height:80px;

    border-radius:50%;

    z-index:4;

    bottom:-120px;

    animation:
        balloonFloat 5s ease-in-out infinite;
}

.balloon:after{
    content:"";

    position:absolute;

    width:2px;
    height:120px;

    background:white;

    top:75px;
    left:50%;

    opacity:.5;
}

.balloon.pink{
    background:#ff4fa3;
}

.balloon.purple{
    background:#9c4dff;
}

.balloon.blue{
    background:#45c7ff;
}

.balloon.yellow{
    background:#ffd34e;
}

.balloon.red{
    background:#ff4d5e;
}

@keyframes balloonFloat{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-30px);
    }

    100%{
        transform:translateY(0);
    }

}


/* =========================
   CONFETTI
========================= */

.confetti{
    position:absolute;

    width:8px;
    height:15px;

    z-index:3;

    top:-30px;

    animation:
        confettiFall linear infinite;
}

@keyframes confettiFall{

    from{
        transform:
            translateY(0)
            rotate(0deg);
    }

    to{
        transform:
            translateY(110vh)
            rotate(720deg);
    }

}


/* =========================
   FLOATING HEARTS
========================= */

.floatingHeart{
    position:absolute;

    z-index:2;

    font-size:25px;

    animation:
        heartFloat 5s linear infinite;
}

@keyframes heartFloat{

    from{
        transform:translateY(0);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    to{
        transform:translateY(-110vh);
        opacity:0;
    }

}


/* =========================
   CAKE
========================= */

.cakeWrap{
    position:absolute;

    left:50%;
    top:43%;

    transform:
        translate(-50%,-50%);

    z-index:5;

    animation:
        cakeAppear 1s ease;
}

@keyframes cakeAppear{

    from{
        transform:
            translate(-50%,-50%)
            scale(.2);

        opacity:0;
    }

    to{
        transform:
            translate(-50%,-50%)
            scale(1);

        opacity:1;
    }

}

.cake{
    position:relative;

    width:320px;
    height:230px;
}

.layer{
    position:absolute;

    left:20px;

    width:280px;

    border-radius:
        20px 20px 15px 15px;
}

.layer.bottom{
    bottom:10px;

    height:80px;

    background:
        linear-gradient(
            #ff5ba9,
            #d62979
        );
}

.layer.middle{
    bottom:75px;

    left:35px;

    width:250px;

    height:65px;

    background:
        linear-gradient(
            #ff80bf,
            #e13a8a
        );
}

.frosting{
    position:absolute;

    left:45px;
    bottom:125px;

    width:230px;
    height:55px;

    border-radius:50%;

    background:#fff5fb;

    z-index:3;
}

.drip{
    position:absolute;

    width:35px;
    height:40px;

    background:#fff5fb;

    border-radius:
        0 0 20px 20px;
}

.drip:nth-child(1){
    left:20px;
    top:25px;
}

.drip:nth-child(2){
    left:75px;
    top:20px;
}

.drip:nth-child(3){
    left:130px;
    top:27px;
}

.drip:nth-child(4){
    left:180px;
    top:18px;
}

.cherry{
    position:absolute;

    width:15px;
    height:15px;

    border-radius:50%;

    background:#ff304f;

    top:-8px;
}

.cherry:nth-child(5){
    left:45px;
}

.cherry:nth-child(6){
    left:110px;
}

.cherry:nth-child(7){
    left:170px;
}

.candle{
    position:absolute;

    width:18px;
    height:60px;

    left:50%;
    bottom:170px;

    transform:
        translateX(-50%);

    background:
        repeating-linear-gradient(
            45deg,
            #ffdb65,
            #ffdb65 8px,
            #ff6bb5 8px,
            #ff6bb5 16px
        );

    border-radius:5px;

    z-index:5;
}

.flame{
    position:absolute;

    width:22px;
    height:32px;

    left:50%;
    top:-28px;

    transform:
        translateX(-50%);

    border-radius:
        50% 50% 50% 50%;

    background:
        radial-gradient(
            circle at 50% 70%,
            #fff 0%,
            #ffd34e 35%,
            #ff6b35 70%,
            transparent 72%
        );

    animation:
        flame 0.7s infinite alternate;
}

@keyframes flame{

    from{
        transform:
            translateX(-50%)
            scale(.9);
    }

    to{
        transform:
            translateX(-50%)
            scale(1.1);
    }

}


/* =========================
   FINAL MESSAGE
========================= */

.final{
    z-index:10;

.finalCard{

        0 0 40px rgba(255,70,180,.25);

}

.finalTitle{

    font-weight:bold;

    color:white;

    text-shadow:
        0 0 10px #ff35b9,

}

.finalText{

    font-size:

    line-height:1.8;

    color:white;

    text-align:center;
}

.signature{

    margin-top:25px;

    color:#ff9bdc;

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    }

    .balloon{
        width:48px;
        height:62px;
    }

    .finalCard{
        padding:20px;
    }

}

</style>
</head>

========================= */

function passwordScreen(){

    content.innerHTML = `

        <div class="passwordScreen">

                    id="passwordInput"
                    class="passwordInput"
                    type="password"
                    inputmode="numeric"
                    maxlength="4"
                    placeholder="••••"
                    autocomplete="off"
                    onkeydown="
                        if(event.key==='Enter')
                        checkPassword()
                    "
                >

                <br>

                <button
                    class="passwordButton"
                    onclick="checkPassword()">

                </button>

                <div
                    id="passwordError"

            </div>

        </div>

    `;


    setTimeout(()=>{

        const input =
            document.getElementById(
                "passwordInput"
            );

        if(input){

            input.focus();

        }

    },100);

}


function checkPassword(){

    const input =
        document.getElementById(
            "passwordInput"
        );

    const error =
        document.getElementById(
            "passwordError"
        );


    if(
        input.value ===
        SECRET_PASSWORD
    ){

        error.textContent="";

        startBirthday();

    }

    else{

        error.textContent =
            "Wrong password 😝 Try again!";

        input.value="";

        input.focus();

    }

}

    content.innerHTML="";


    for(let i=0;i<30;i++){

            document.createElement("div");

            "floatingHeart";

/* =========================
   CONFETTI
========================= */

function createConfetti(amount){

    for(let i=0;i<amount;i++){

        const c =
            document.createElement("div");

        c.className="confetti";

        c.style.left =
            Math.random()*100+"%";

        c.style.background =
            [
                "#ff4fa3",
                "#9c4dff",
                "#ffd34e",
                "#45c7ff",
                "#ffffff"
            ][
                Math.floor(
                    Math.random()*5
                )
            ];

        c.style.animationDuration =
            (3+Math.random()*4)+"s";

        c.style.animationDelay =
            Math.random()*2+"s";

        app.appendChild(c);

    }

}


/* =========================
   BALLOONS
========================= */
